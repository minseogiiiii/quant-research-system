name: Q14 explicit variable semantics and lint review (ISOLATED)
on:
  push:
    branches: [remediation/q14-import-order-20261122]
    paths: ['.github/workflows/q14_semantic_name_cleanup_gate.yml']
permissions:
  contents: read
jobs:
  q14-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - run: python -m pip install 'ruff==0.15.22'
      - name: Prove all renamed variable source still imports and old E741 eliminated
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests .github/scripts
          ruff check btc_eth_terminal/tests/test_v10_soak.py \
            btc_eth_terminal/tests/test_v19_maker_queue.py \
            btc_eth_terminal/backend/original_pair_audit_v20.py \
            .github/scripts/q14_import_order_refactor.py --select E741
          ruff check btc_eth_terminal/backend/v22_independent_hurdle_audit.py --select E731
      - name: Run pinned original-pair and archive safety regression and root unit tests
        shell: bash
        env:
          PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
        run: |
          set -euo pipefail
          python .github/scripts/q7_static_cost_regression.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v19_maker_queue.py' -q
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v10_soak.py' -q
          python -m unittest discover -s .github/scripts -p 'test_q12_ruff_compare.py' -q
          uv sync --locked --no-editable --default-index https://pypi.org/simple
          .venv/bin/python -m pytest -q
      - name: Count remaining full Ruff violations without suppression
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,json,collections
          r=subprocess.run(['ruff','check','.','--output-format','json'],capture_output=True,text=True)
          assert r.returncode in (0,1)
          values=json.loads(r.stdout)
          print('Q14_REMAINING_AFTER_NAME_FIX',json.dumps({
            'total':len(values),
            'by_rule':dict(sorted(collections.Counter(v['code'] for v in values).items()))
          },sort_keys=True))
          PY
# Never modifies any Git refs.
