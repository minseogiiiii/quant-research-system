name: Q12 Ruff baseline vs staged delta (DIAGNOSTIC, NOT RELEASE APPROVAL)
on:
  push:
    branches: [staging/q7-readonly-qualification-20261119]
    paths:
      - '.github/workflows/q7_ruff_delta_diagnostic.yml'
      - '.github/scripts/q12_ruff_compare.py'
      - '.github/scripts/test_q12_ruff_compare.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruff-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full Q7 source and R5 baseline ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test diagnostic classifier before running on real repository
        run: python -m unittest discover -s .github/scripts -p 'test_q12_ruff_compare.py' -v
      - name: Install the exact root-project Ruff version
        run: python -m pip install 'ruff==0.15.22'
      - name: Restore frozen R5 baseline in independent worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/r5_clean" 64aa85081cab73c917333249eb8e200c8d4044fa
          test "$(git -C "$RUNNER_TEMP/r5_clean" rev-parse HEAD)" = "64aa85081cab73c917333249eb8e200c8d4044fa"
      - name: Compare full Ruff diagnostics with line-stable fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/q12_ruff_compare.py \
            --base-root "$RUNNER_TEMP/r5_clean" \
            --candidate-root "$GITHUB_WORKSPACE" \
            --base-sha 64aa85081cab73c917333249eb8e200c8d4044fa \
            --head-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/q12_ruff_delta.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'q12_ruff_delta.json').read_text())
          assert r['schema']=='q12_full_repo_ruff_baseline_delta_v1'
          assert r['candidate_sha']==os.environ['GITHUB_SHA']
          assert r['full_validation_passed'] is False
          assert r['production_acceptance'] is False
          assert r['introduced_on_existing_files']+r['introduced_on_new_files']==r['introduced_violations']
          assert r['candidate_violations']-r['baseline_violations']==r['introduced_violations']-r['resolved_violations']
          print('PASS_Q12_RUFF_DIAGNOSTIC_INVARIANTS_NOT_VALIDATION_APPROVAL')
          PY
      - name: Save complete aggregate diagnostic without source archives
        uses: actions/upload-artifact@v4
        with:
          name: q12-ruff-baseline-vs-staged-delta
          path: ${{ runner.temp }}/q12_ruff_delta.json
          retention-days: 7
          if-no-files-found: error
