name: Q294 duplicate snapshot forensic recovery
on:
  push:
    branches: ['p0/q294-c1-dup-snapshot-20261124']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check btc_eth_terminal/scripts/btc_eth_multiday_v20.mjs
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_q294_duplicate_snapshot.py' -v
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_v36_2_transport_gap.py' -v
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_q293_b4_diagnostics.py' -v
