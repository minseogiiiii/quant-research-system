name: Q7 partial-source provenance (NOT release acceptance)
on:
  push:
    branches: [staging/q7-readonly-qualification-20261119]
    paths:
      - '.github/workflows/q7_partial_source_provenance.yml'
      - '.github/scripts/q7_partial_source_provenance.py'
      - 'btc_eth_terminal/backend/v37_*.py'
      - 'btc_eth_terminal/backend/q7_experiment_prereg*'
      - 'btc_eth_terminal/frontend/src/FactorLabPanel.tsx'
      - 'btc_eth_terminal/frontend/v37_dist_integrity.json'
      - 'btc_eth_terminal/scripts/v37_build_frontend.py'
  pull_request:
    branches: [integration/btc-eth-unified-terminal]
permissions:
  contents: read
jobs:
  verify-partial-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact eight Q7 source Git blobs, read-only prereg and legacy asset pins
        run: python .github/scripts/q7_partial_source_provenance.py
      - name: Ensure the same fail-closed verification under optimized Python\n        run: python -O .github/scripts/q7_partial_source_provenance.py\n      - name: Explicitly refuse to reinterpret partial check as release approval
        shell: bash
        run: |
          echo 'PASS_PARTIAL_Q7_BLOB_PROVENANCE_ONLY'
          echo 'INCOMPLETE_Q7_SOURCE_278_FILE_GATE_REMAINS_BLOCKED'
          echo 'NO_LIVE_Q7_NO_MAIN_MERGE_NO_ORDERS'
