name: U1 final candidate qualification (no live execution)
on:
  push:
    branches: ['remediation/u1-ast-format-20261127']
    paths: ['.github/workflows/u1_final_candidate.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:btc_eth_terminal:btc_eth_terminal/backend:btc_eth_terminal/scripts:btc_eth_terminal/tests:.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.15.22 pytest pyarrow==19.0.1 duckdb==1.2.2 numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1 pydantic pydantic-settings
      - run: python btc_eth_terminal/scripts/verify_fincept_vendor.py
      - run: ruff check .
      - run: python -m compileall -q btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests .github/scripts
      - name: Standby fencing and original duplicate, failover and C1 contracts
        run: |
          python -m pytest -c /dev/null -q \
            btc_eth_terminal/tests/test_u1_standby_epoch_fence.py \
            btc_eth_terminal/tests/test_q294_duplicate_snapshot.py \
            btc_eth_terminal/tests/test_q292_resilient_gateway.py \
            btc_eth_terminal/tests/test_q292_failover_policy.py \
            btc_eth_terminal/tests/test_q293_c1_contract.py \
            btc_eth_terminal/tests/test_h13_native_store.py
  root:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: ./scripts/check.sh
  frontend:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix btc_eth_terminal/frontend
      - working-directory: btc_eth_terminal/frontend
        run: |
          npm run build
          npx --no-install vite build --config vite.workspace.config.ts
          npx --no-install tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir tests/workspace-compiled src/workspace/model.ts
          node --test tests/workspace.test.mjs
          npx --no-install tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir tests/compiled src/datahub/resilientStore.ts src/datahub/resilientClient.ts
          node --test tests/resilientStore.test.mjs
          npx --no-install tsc --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir tests/candle-compiled src/workspace/candleContract.ts
          node --test tests/candleContract.test.mjs
          node --experimental-strip-types --test tests/marketStateIntegrity.test.mjs tests/v36_1_completed_candle_feed.test.mjs
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python btc_eth_terminal/scripts/f3_workspace_browser.py
  private-offline:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pyarrow==19.0.1 duckdb==1.2.2 numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1
      - name: Recover previously authorized immutable Q7 release
        env:
          Q13_PRIVATE_RELEASE_URL: ${{ secrets.Q13_PRIVATE_RELEASE_URL }}
          Q13_GITHUB_ARCHIVE_TOKEN: ${{ secrets.Q13_GITHUB_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/u1-private"
          python .github/scripts/q16_secure_private_archive_download.py --output "$RUNNER_TEMP/u1-private/q7.zip"
          python .github/scripts/u1_restore_fixtures.py "$RUNNER_TEMP/u1-private/q7.zip" btc_eth_terminal
          git diff --exit-code
      - name: Run all terminal tests in isolated network namespace, loopback only
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          RUNNER_USER="$(id -un)"
          export PYTHONPATH="$PWD/btc_eth_terminal:$PWD/btc_eth_terminal/backend:$PWD/btc_eth_terminal/scripts:$PWD/btc_eth_terminal/tests:$PWD/.github/scripts"
          export PATH
          export V35_CLEAN_ARCHIVE="$PWD/btc_eth_terminal/backend/data/live_v14_clean_120s/coinbase_btc_eth_soak_wsgXRy"
          export V35_DISCONNECT_ARCHIVE="$PWD/btc_eth_terminal/backend/data/live_v14_disconnect_120s/coinbase_btc_eth_soak_gEF6uZ"
          test -f "$V35_CLEAN_ARCHIVE/manifest.json"
          test -f "$V35_DISCONNECT_ARCHIVE/manifest.json"
          set +e
          sudo --preserve-env=PATH,PYTHONPATH,V35_CLEAN_ARCHIVE,V35_DISCONNECT_ARCHIVE unshare --net bash -c '
            set -e
            ip link set lo up
            sudo --preserve-env=PATH,PYTHONPATH,V35_CLEAN_ARCHIVE,V35_DISCONNECT_ARCHIVE -u "$1" "$2" -c "import socket; s=socket.socket(); s.bind((\"127.0.0.1\",0)); s.close(); import sys; exec(\"try:\\n socket.getaddrinfo(\\\"advanced-trade-ws.coinbase.com\\\",443)\\nexcept socket.gaierror:\\n sys.exit(0)\\nelse:\\n sys.exit(9)\")"
            sudo --preserve-env=PATH,PYTHONPATH,V35_CLEAN_ARCHIVE,V35_DISCONNECT_ARCHIVE -u "$1" "$2" -m pytest -c /dev/null -q btc_eth_terminal/tests --junitxml="$3"
          ' bash "$RUNNER_USER" "$PY" "$RUNNER_TEMP/u1-private/results.xml" > "$RUNNER_TEMP/u1-private/test.log" 2>&1
          rc=$?
          set -e
          python - "$RUNNER_TEMP/u1-private/results.xml" "$rc" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(sys.argv[1])
          if not path.exists():
              print("BLOCKED_OFFLINE_EXECUTION_OR_COLLECTION")
              raise SystemExit(1)
          root=ET.parse(path).getroot()
          suites=[root] if root.tag=="testsuite" else list(root.findall("testsuite"))
          print("U1_PRIVATE_REGRESSION", json.dumps({k:sum(int(s.get(k,0)) for s in suites) for k in ("tests","failures","errors","skipped")}))
          for case in root.iter("testcase"):
              for tag in ("failure","error","skipped"):
                  if case.find(tag) is not None:
                      print(tag.upper(),case.get("classname"),case.get("name"))
          raise SystemExit(int(sys.argv[2]) or (1 if any(int(s.get("skipped",0)) for s in suites) else 0))
          PY
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/u1-private"
# No private-data artifact, no raw test output, no write permissions.
