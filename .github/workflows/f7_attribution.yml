name: F7 attribution and real Fincept ledger
on:
  push:
    branches: ['integration/h1-f6-research-20261124']
    paths: ['btc_eth_terminal/backend/f6_liquidity_recovery.py','btc_eth_terminal/backend/f7_*.py','btc_eth_terminal/tests/test_f7_*.py','btc_eth_terminal/scripts/f7_real_attribution_gate.py','.github/workflows/f7_attribution.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:btc_eth_terminal/tests:.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pandas==2.2.3
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_f6_*.py' -v
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_f7_*.py' -v
      - name: Fetch authorized frozen source
        env:
          Q13_PRIVATE_RELEASE_URL: ${{ secrets.Q13_PRIVATE_RELEASE_URL }}
          Q13_GITHUB_ARCHIVE_TOKEN: ${{ secrets.Q13_GITHUB_ARCHIVE_TOKEN }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/f7-private" "$RUNNER_TEMP/f7-report"
          python .github/scripts/q16_secure_private_archive_download.py --output "$RUNNER_TEMP/f7-private/q7.zip"
      - run: python btc_eth_terminal/scripts/f7_real_attribution_gate.py --release-zip "$RUNNER_TEMP/f7-private/q7.zip" --output "$RUNNER_TEMP/f7-report/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f7-attribution-receipt
          path: ${{ runner.temp }}/f7-report/receipt.json
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/f7-private"
