name: Q14 literal and expression exact AST audit (ISOLATED)
on:
  push:
    branches: [remediation/q14-import-order-20261122]
    paths: ['.github/workflows/q14_exact_ast_literal_audit.yml']
permissions:
  contents: read
jobs:
  ast-literal-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - run: python -m pip install 'ruff==0.15.22'
      - name: Compare exact Python AST on six relevant files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,pathlib,subprocess
          base='5339846b2f08aa5e0f1de60effd8b7748ba688b6'
          names=(
             'btc_eth_terminal/backend/bridge.py',
             'btc_eth_terminal/backend/v22_independent_hurdle_audit.py',
             'btc_eth_terminal/backend/v25_original_pair_inventory.py',
             'btc_eth_terminal/scripts/v36_1_live_browser_e2e.py',
             'btc_eth_terminal/backend/original_pair_audit_v20.py',
             'btc_eth_terminal/tests/test_v24_paper_oms.py'
          )
          for file in names:
              old=subprocess.check_output(['git','show',base+':'+file],text=True)
              new=pathlib.Path(file).read_text()
              before=ast.dump(ast.parse(old),include_attributes=False)
              after=ast.dump(ast.parse(new),include_attributes=False)
              if before!=after:raise SystemExit('Q14_AST_MISMATCH:'+file)
          print('PASS_Q14_6_OF_6_EXACT_AST_SEMANTICS')
          PY
          python -m compileall -q btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests
      - name: Run targeted Q7 release safety plus root pytest
        shell: bash
        env:
          PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
        run: |
          set -euo pipefail
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v24_paper_oms.py' -q
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v19_maker_queue.py' -q
          python .github/scripts/q7_static_cost_regression.py
          uv sync --locked --no-editable --default-index https://pypi.org/simple
          .venv/bin/python -m pytest -q
      - name: Report full Ruff residue accurately
        run: |
          python - <<'PY'
          import subprocess,json,collections
          p=subprocess.run(['ruff','check','.','--output-format','json'],capture_output=True,text=True)
          assert p.returncode in (0,1)
          issues=json.loads(p.stdout)
          print('Q14_RUFF_POST_EXACT_AST',json.dumps({
             'remaining':len(issues),
             'by_rule':dict(sorted(collections.Counter(x['code'] for x in issues).items())),
             'release_approval':False},sort_keys=True))
          PY
