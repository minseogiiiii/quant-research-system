name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Run clean validation suite
        run: ./scripts/check.sh

      - name: Generate synthetic validation figures
        run: .venv/bin/python scripts/generate_validation_figures.py --output-dir reports/validation

      - name: Upload validation figures
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-validation-figures
          path: reports/validation/*.svg
          if-no-files-found: error
