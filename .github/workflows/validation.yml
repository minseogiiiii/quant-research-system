name: Validation

on:
  pull_request:
  push:
    branches:
      - audit/vlab-backtest-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Run clean validation suite
        run: ./scripts/check.sh
