name: H13 native archive admission contracts
on:
  push:
    branches: ['integration/h1-f6-research-20261124']
    paths: ['btc_eth_terminal/scripts/h13_native_store.py','btc_eth_terminal/tests/test_h13_native_store.py','.github/workflows/h13_native_store.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:btc_eth_terminal/tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow==19.0.1 duckdb==1.2.2
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_h13_native_store.py' -v
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_h4_cross_session_catalog.py' -v
