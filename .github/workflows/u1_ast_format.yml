name: U1 AST-preserving format remediation
on:
  push:
    branches: ['remediation/u1-ast-format-20261127']
    paths: ['.github/workflows/u1_ast_format.yml']
permissions:
  contents: write
concurrency:
  group: u1-ast-format
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/remediation/u1-ast-format-20261127' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.22
      - name: Format own code only; reject AST drift, pin drift and new lint diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/u1-report"
          python btc_eth_terminal/scripts/u1_ast_format.py "$RUNNER_TEMP/u1-report/report.json"
          git diff --check
          python btc_eth_terminal/scripts/verify_fincept_vendor.py
          git diff --exit-code -- btc_eth_terminal/vendor
          git diff --binary > "$RUNNER_TEMP/u1-report/candidate.patch"
      - name: Publish candidate commit on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'remediation/u1-ast-format-20261127'
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests
            git diff --cached --quiet && exit 0
            git commit -m 'U1: AST-identical first-pass source formatting (candidate only)'
            git push origin HEAD:refs/heads/remediation/u1-ast-format-20261127
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/u1-report/candidate_sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u1-ast-format-report
          path: ${{ runner.temp }}/u1-report/
          if-no-files-found: error
