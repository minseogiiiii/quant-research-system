name: Fincept F4 order flow candidate
on:
  push:
    branches: ['integration/fincept-f4-depth-20261124']
permissions:
  contents: read
jobs:
  flow-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: btc_eth_terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          npx --no-install tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir tests/flow-compiled src/orderflow/contract.ts
          node --test tests/orderflow.test.mjs
          npx --no-install tsc --noEmit
          npx --no-install vite build --config vite.orderflow.config.ts
  flow-browser:
    needs: flow-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --prefix btc_eth_terminal/frontend
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python btc_eth_terminal/scripts/f4_orderflow_browser.py
