name: Q14 targeted behavior-preserving lint refactors (ISOLATED)
on:
  push:
    branches: [remediation/q14-import-order-20261122]
    paths: ['.github/workflows/q14_targeted_safe_refactors.yml']
permissions:
  contents: write
jobs:
  q14-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - run: python -m pip install 'ruff==0.15.22'
      - name: Fix only selected import/context, branching and supported-version issues
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "remediation/q14-import-order-20261122"
          python - <<'PY'
          import collections
          import json
          import subprocess
          rules='B007,I001,SIM102,SIM105,SIM117,UP036'
          def issues():
              r=subprocess.run(['ruff','check','.','--output-format','json'],
                               capture_output=True,text=True)
              if r.returncode not in (0,1):raise RuntimeError(r.stderr[:600])
              return json.loads(r.stdout)
          before=issues()
          p=subprocess.run(['ruff','check','btc_eth_terminal','--select',rules,
                            '--fix','--unsafe-fixes'],capture_output=True,text=True)
          if p.returncode not in (0,1):raise RuntimeError(p.stderr[:600])
          after=issues()
          def count(rows):return dict(sorted(collections.Counter(v['code'] for v in rows).items()))
          print('Q14_TARGETED_REFACTOR',json.dumps({
              'before':len(before),'after':len(after),
              'before_rules':count(before),'after_rules':count(after),
              'unsafe_fixes_restricted_to':rules,'noqa_used':False,
          },sort_keys=True))
          if len(after)>=len(before):raise RuntimeError('NO_REMEDIATION_BENEFIT')
          PY
          python -m compileall -q btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests
      - name: Verify root tests and read-only Q7 transport contracts
        shell: bash
        env:
          PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
        run: |
          set -euo pipefail
          python .github/scripts/q7_static_cost_regression.py
          for f in \
            test_v36_2_transport_gap.py \
            test_v36_2_sse_backpressure.py \
            test_v36_3_durable_archive_gate.py \
            test_v36_3_operator_monitor.py; do
            python -m unittest discover -s btc_eth_terminal/tests -p "$f" -q
          done
          uv sync --locked --no-editable --default-index https://pypi.org/simple
          .venv/bin/python -m pytest -q
      - name: Commit reviewed candidate only, no production promotion
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | python -c 'import sys; a=[x.strip() for x in sys.stdin if x.strip()]; assert a and all(x.startswith("btc_eth_terminal/") and x.endswith(".py") for x in a)'
          git add -u -- btc_eth_terminal
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Q14: targeted import and context refactors under regression gate'
          git push origin HEAD:refs/heads/remediation/q14-import-order-20261122
