name: BTC ETH Public Candle Evidence (isolated)
on:
  push:
    branches:
      - evidence/btc-eth-candles-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical_candles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Capture raw Coinbase responses without credentials or orders
        run: python scripts/btc_eth_capture_once.py
      - name: Preserve audit evidence (including failure status)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-eth-public-candles-20261108
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  live_l2_20s:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Record 20 seconds of read-only public BTC ETH L2 and market trades
        run: |
          node --version
          node scripts/btc_eth_public_l2_pilot.mjs
      - name: Archive L2 evidence even when incomplete
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-eth-public-l2-pilot-20s
          path: l2_evidence/
          if-no-files-found: warn
          retention-days: 14

  reconnect_reference_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Capture two read-only BTC/ETH WebSocket sessions with deliberate reconnect and public REST book
        run: |
          node --version
          node --check scripts/btc_eth_reconnect_reference_pilot.mjs
          node scripts/btc_eth_reconnect_reference_pilot.mjs
      - name: Retain full raw and audit status, even if source failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-eth-controlled-reconnect-rest-reference
          path: reconnect_evidence/
          if-no-files-found: warn
          retention-days: 30
