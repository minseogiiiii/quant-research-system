name: Unified terminal frontend production build

on:
  push:
    branches:
      - integration/btc-eth-unified-terminal
    paths:
      - 'btc_eth_terminal/frontend/**'
      - 'btc_eth_terminal/scripts/v36_build_frontend.py'
      - '.github/workflows/unified_terminal_frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: btc_eth_terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact read-only L2 market-state contract without npm dependencies
        run: node --experimental-strip-types --test tests/marketStateIntegrity.test.mjs
      - name: Install pinned chart and React dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve exact pinned dependencies for offline candidate verification
        uses: actions/upload-artifact@v4
        with:
          name: v36-frontend-pinned-node-modules
          path: btc_eth_terminal/frontend/node_modules/
          retention-days: 1
          include-hidden-files: true
      - name: Validate actual TypeScript and Vite production build
        run: npm run build
      - name: Retain unpromoted candidate build for independent audit
        uses: actions/upload-artifact@v4
        with:
          name: v35-1-unpinned-candidate-dist
          path: btc_eth_terminal/frontend/dist_v36/
          retention-days: 7
      - name: Verify v36 source-pinned browser assets, preserve legacy dist
        run: python ../scripts/v36_build_frontend.py --verify-existing
      - name: Check generated browser bundle files
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          sha256sum dist/index.html
      - name: Preserve browser production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-v36-source-pinned-funnest-dist
          path: btc_eth_terminal/frontend/dist/
          retention-days: 7
