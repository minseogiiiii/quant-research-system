name: Q14 exact literal/network formatting parity gate
on:
  push:
    branches: [remediation/q14-import-order-20261122]
    paths: ['.github/workflows/q14_port_and_tuple_parity.yml']
permissions:
  contents: read
jobs:
  q14-port-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - run: python -m pip install 'ruff==0.15.22'
      - name: Prove changed root Python AST identity and port string equivalence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          root=subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip()
          paths=['src/world_quant_system/research/portfolio_promotion_simulation.py',
                 'tests/unit/research/test_portfolio_promotion_engine.py']
          for path in paths:
              before=subprocess.check_output(['git','show','HEAD~6:'+path],text=True)
              after=pathlib.Path(path).read_text()
              if ast.dump(ast.parse(before),include_attributes=False)!=ast.dump(ast.parse(after),include_attributes=False):
                  raise SystemExit('CHANGED_ROOT_SOURCE_AST:'+path)
          for port in (1,80,8080,65535):
              a="http://127.0.0.1:%d" % port
              b=f"http://127.0.0.1:{port}"
              assert a==b
          print('PASS_Q14_ROOT_AST_AND_LOOPBACK_PORT_FORMAT_PARITY')
          PY
          python -m compileall -q src tests btc_eth_terminal/backend btc_eth_terminal/scripts btc_eth_terminal/tests
          ruff check . --select UP031,F401 --output-format concise
      - name: Run root and fixture-free read-only safety tests; HTTP bundle parity remains private
        shell: bash
        env:
          PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
        run: |
          set -euo pipefail
          python .github/scripts/q7_static_cost_regression.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v36_2_transport_gap.py' -q
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_v36_3_durable_archive_gate.py' -q
          uv sync --locked --no-editable --default-index https://pypi.org/simple
          .venv/bin/python -m pytest -q
          echo 'HISTORICAL_FRONTEND_HTTP_E2E_NOT_RUN_REQUIRES_PINNED_IMMUTABLE_ASSETS'
      - name: Record final Ruff total, never suppress errors
        run: |
          python - <<'PY'
          import subprocess,json,collections
          p=subprocess.run(['ruff','check','.','--output-format','json'],capture_output=True,text=True)
          assert p.returncode in (0,1)
          a=json.loads(p.stdout)
          print('Q14_RUFF_AFTER_PORT_AND_ROOT_FORMAT',json.dumps({
            'total':len(a),'by_rule':dict(sorted(collections.Counter(x['code'] for x in a).items()))
          }))
          PY
# Isolated regression gate. Never approves production.
