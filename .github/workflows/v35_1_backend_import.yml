name: v35.1 read-only backend import and safety
on:
  push:
    branches:
      - integration/btc-eth-unified-terminal
    paths:
      - 'btc_eth_terminal/backend/**'
      - 'btc_eth_terminal/tests/test_v35_2_transport_contract.py'
      - '.github/workflows/v35_1_backend_import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-only-import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile existing and new read-only backend
        run: python -m compileall -q btc_eth_terminal/backend
      - name: Import entire v35.1 dependency graph without historical data
        env:
          PYTHONPATH: btc_eth_terminal/backend
        run: |
          python - <<'PY'
          import v35_archive_ingress
          import v35_replay_service
          import v35_unified_gateway
          import v35_1_frontend_integrity
          from v35_unified_gateway import server_for
          from v35_replay_service import ReplayDataset
          from v35_archive_ingress import ArchiveRejected
          assert v35_archive_ingress.PRODUCTS == frozenset({'BTC-USD','ETH-USD'})
          assert v35_unified_gateway.MAX_SSE_EVENTS <= 60
          try:
              server_for(None, host='0.0.0.0')
          except Exception as exc:
              assert 'LOOPBACK_ONLY' in str(exc)
          else:
              raise AssertionError('Non-loopback bind unexpectedly permitted')
          print('PASS: v35.1 modules import without private archives; loopback policy enforced')
          PY
      - name: Validate bounded HTTP clients and telemetry without private archives
        env:
          PYTHONPATH: btc_eth_terminal/backend
        run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_v35_2_transport_contract.py' -v
      - name: Confirm no v35 real exchange order transport or broker write adapter was introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          modules=['v35_archive_ingress.py','v35_replay_service.py','v35_unified_gateway.py','v35_1_frontend_integrity.py']
          for name in modules:
              data=(Path('btc_eth_terminal/backend')/name).read_text()
              for marker in ('create_order(', 'submit_order(', 'place_order(', 'send_order('):
                  assert marker not in data, (name,marker)
          print('PASS: explicit v35.1 no-order surface check (limited static scan)')
          PY
