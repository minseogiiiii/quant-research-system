name: Q299-D recurrent dual-source burst and settled memory (offline)
on:
  push:
    branches: ['remediation/u1-ast-format-20261127']
    paths: ['.github/workflows/q299d_recurrent_burst.yml']
permissions:
  contents: read
  actions: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [recurrent]
    env:
      PYTHONPATH: ${{ github.workspace }}/btc_eth_terminal/backend:${{ github.workspace }}/btc_eth_terminal/scripts:${{ github.workspace }}/.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.15.22 pytest numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 pyarrow==19.0.1 duckdb==1.2.2 scikit-learn==1.6.1
      - run: ruff check .
      - name: Pin unchanged production pipeline and Q298 reference evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 3478e9df180da0208cd39bc9bf743c783764bdf6 HEAD -- btc_eth_terminal/backend btc_eth_terminal/scripts/q292_dual_gateway.py btc_eth_terminal/scripts/q292_isolated_observer.py btc_eth_terminal/scripts/btc_eth_multiday_v20.mjs btc_eth_terminal/scripts/q292_resilient_gateway.py btc_eth_terminal/scripts/q292_stream_gateway.py
          python - <<'PY'
          import io, json, os, zipfile
          from q29_artifact_transport import fetch_bytes
          raw=fetch_bytes(os.environ["GITHUB_REPOSITORY"],os.environ["GH_TOKEN"],artifact_id=15231501128,name="q298-redacted-stress-receipt",run_id=46065718972,sha="3478e9df180da0208cd39bc9bf743c783764bdf6",zip_sha="75364d147590c7e6fd0f12ec2a7a6cfdabc2849a317427e49b6e1338f75842f8")
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.namelist()==["stress.json"] and z.testzip() is None
              r=json.loads(z.read("stress.json"))
          assert r["status"]=="PASS" and r["five_hour_approved"] is False
          assert r["historical_burst"]["max_frame_bytes"]==4694042
          assert r["historical_burst"]["windows"]==[{"window_ns":100000000,"max_bytes":4854848,"max_messages":35},{"window_ns":1000000000,"max_bytes":7298337,"max_messages":75}]
          print("Q299_EXACT_Q298_REFERENCE_PASS")
          for aid,name,run,sha,digest in (
              (15234432236,"q299c-prebuilt-redacted-receipt",46074068450,"3e871720a0491de05318d98c64da2b8ac6030a2f","5279d2390ca5ecc72eb65f41161b3f57807ee7e3f081c0dfde591491dd7bcf02"),
              (15232869668,"q299-overflow-redacted-receipt",46072172406,"1c45d905faa2bb880b5ab4b30092f164734f431f","8716daee2a23e7629b61469524c3947d4ea609c85f86053009b70e79a86c34ba")):
              data=fetch_bytes(os.environ["GITHUB_REPOSITORY"],os.environ["GH_TOKEN"],artifact_id=aid,name=name,run_id=run,sha=sha,zip_sha=digest)
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  assert z.namelist()==["receipt.json"] and z.testzip() is None
                  result=json.loads(z.read("receipt.json"))
              assert result["status"]=="PASS" and result["five_hour_approved"] is False
          print("Q299D_EXACT_PRIOR_GATES_PASS")
          PY
      - name: Isolate network and replace only synthetic fixture in ephemeral checkout
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cp btc_eth_terminal/tests/q299d_recurrent_mock.mjs btc_eth_terminal/tests/q292_dual_source_mock.mjs
          node --check btc_eth_terminal/tests/q292_dual_source_mock.mjs
          mkdir -m 700 "$RUNNER_TEMP/q299-output"
          PY="$(command -v python)"
          RUNNER_USER="$(id -un)"
          sudo --preserve-env=PATH,PYTHONPATH,GITHUB_SHA,GITHUB_RUN_ID unshare --net bash -c '
            set -e
            ip link set lo up
            sudo --preserve-env=PATH,PYTHONPATH,GITHUB_SHA,GITHUB_RUN_ID -u "$1" "$2" -m pytest -c /dev/null -q btc_eth_terminal/tests/test_q299d_memory_contract.py
            sudo --preserve-env=PATH,PYTHONPATH,GITHUB_SHA,GITHUB_RUN_ID -u "$1" timeout 330 "$2" -u btc_eth_terminal/scripts/q299d_recurrent_burst.py --workdir "$3/q299" --output "$3/q299-output/receipt.json"
          ' bash "$RUNNER_USER" "$PY" "$RUNNER_TEMP" "$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q299d-recurrent-redacted-receipt
          path: ${{ runner.temp }}/q299-output/receipt.json
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/q299" "$RUNNER_TEMP/q299-output"
# No real market capture or five-hour approval.

# Q299: repair nested-if lint and exercise the 100ms message-count target.
