name: Q297 P0 immutable evidence and capacity preflight (no market I/O)
on:
  push:
    branches: ['remediation/u1-ast-format-20261127']
    paths: ['.github/workflows/q297_p0_preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:btc_eth_terminal/tests:.github/scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.22 pytest
      - run: python btc_eth_terminal/scripts/verify_fincept_vendor.py
      - run: ruff check .
      - name: Re-download both exact successful real pilots and audit capacity
        run: python btc_eth_terminal/scripts/q297_p0_preflight.py --directory "$RUNNER_TEMP/q297-evidence"
      - name: Adversarial tests against exact evidence and five-hour policy contracts
        env:
          Q297_RECEIPTS: ${{ runner.temp }}/q297-evidence
        run: |
          python -m pytest -c /dev/null -q btc_eth_terminal/tests/test_q297_p0_preflight.py btc_eth_terminal/tests/test_q296_c2_policy.py --junitxml="$RUNNER_TEMP/q297-evidence/result.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse(Path(os.environ['RUNNER_TEMP'])/'q297-evidence/result.xml').getroot()
          suites=[r] if r.tag=='testsuite' else list(r.findall('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)>=18
          assert all(not int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q297-preflight-redacted
          path: ${{ runner.temp }}/q297-evidence/preflight.json
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/q297-evidence"
  exact-frozen-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Mandatory original ZIP retrieval, exact SHA and six source restore tests
        env:
          Q13_GITHUB_ARCHIVE_TOKEN: ${{ secrets.Q13_GITHUB_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/q297-v34"
          python .github/scripts/p0_fetch_v34.py "$RUNNER_TEMP/q297-v34/original.zip"
          FROZEN_V34_1_ZIP="$RUNNER_TEMP/q297-v34/original.zip" python -m pytest -c /dev/null -q btc_eth_terminal/tests/test_v35_restore_frozen_source.py --junitxml="$RUNNER_TEMP/q297-v34/result.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse(Path(os.environ['RUNNER_TEMP'])/'q297-v34/result.xml').getroot()
          suites=[r] if r.tag=='testsuite' else list(r.findall('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==6
          assert all(not int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))
          PY
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/q297-v34"
# No 5-hour or live order execution step exists in this workflow.
