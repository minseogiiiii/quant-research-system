name: BTC ETH v13 Rolling Archive Real Source Probe
on:
  push:
    branches:
      - evidence/v13-rolling-p0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling_public_source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SOAK_DURATION_SECONDS: '120'
      SOAK_CHUNK_LIMIT_BYTES: '524288'
      SOAK_RAW_BUDGET_BYTES: '1000000000'
      SOAK_ARCHIVE_BUDGET_BYTES: '1258291200'
      SOAK_DISK_RESERVE_BYTES: '268435456'
    steps:
      - uses: actions/checkout@v7
      - name: Check read-only Node source
        run: |
          node --version
          node --check scripts/btc_eth_rolling_v13.mjs
      - name: Collect actual BTC ETH source for 120 seconds using small rolling chunks
        run: node scripts/btc_eth_rolling_v13.mjs
      - name: Retain all source and fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btc-eth-v13-real-rolling-120s
          path: soak_evidence/
          retention-days: 14
          if-no-files-found: warn
