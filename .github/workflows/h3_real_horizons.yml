name: H3 frozen momentum horizons historical and 20m pilot
on:
  push:
    branches: ['integration/h1-f6-research-20261124']
    paths: ['btc_eth_terminal/scripts/h3_real_horizons_gate.py','btc_eth_terminal/scripts/h1_f6_dataset_replay.py','.github/workflows/h3_real_horizons.yml']
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:btc_eth_terminal/tests:.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow==19.0.1 duckdb==1.2.2
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_h3_*.py' -v
      - run: python -m unittest discover -s btc_eth_terminal/tests -p 'test_h1_replay_physical_order.py' -v
      - name: Fetch authorized private historical source
        env:
          Q13_PRIVATE_RELEASE_URL: ${{ secrets.Q13_PRIVATE_RELEASE_URL }}
          Q13_GITHUB_ARCHIVE_TOKEN: ${{ secrets.Q13_GITHUB_ARCHIVE_TOKEN }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/h3-private" "$RUNNER_TEMP/h3-historical"
          python .github/scripts/q16_secure_private_archive_download.py --output "$RUNNER_TEMP/h3-private/q7.zip"
      - run: python btc_eth_terminal/scripts/h3_real_horizons_gate.py --release-zip "$RUNNER_TEMP/h3-private/q7.zip" --output "$RUNNER_TEMP/h3-historical/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: h3-historical-diagnostic
          path: ${{ runner.temp }}/h3-historical/receipt.json
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/h3-private"
  forward:
    needs: historical
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts:.github/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pyarrow==19.0.1 duckdb==1.2.2
      - uses: actions/download-artifact@v4
        with:
          name: h3-historical-diagnostic
          path: ${{ runner.temp }}/h3-historical
      - run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/h3-forward"
          python -u btc_eth_terminal/scripts/h3_real_horizons_gate.py --historical-receipt "$RUNNER_TEMP/h3-historical/receipt.json" --output "$RUNNER_TEMP/h3-forward/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: h3-forward-diagnostic
          path: ${{ runner.temp }}/h3-forward/receipt.json
          if-no-files-found: error
