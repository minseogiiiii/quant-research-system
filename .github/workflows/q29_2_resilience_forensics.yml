name: Q29.2 diagnostic race regression and read-only fault acceptance
on:
  push:
    branches: [p0/q29-2-resilience-forensics-20261123]
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source and readonly pin verification
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          m=json.loads(pathlib.Path('.github/release-evidence/q14_candidate_source_git_blobs.json').read_text())
          assert len(m['source_git_blobs'])==278
          assert all(m[k] is False for k in ('real_orders_enabled','release_approved','merge_approved'))
          for p,sha in m['source_git_blobs'].items():
              assert subprocess.check_output(['git','hash-object',p],text=True).strip()==sha,p
          PY
      - name: Lint changed Python and verify new diagnostic regression
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.22
          ruff check btc_eth_terminal/scripts/q24_ws_diagnostic_receipt.py btc_eth_terminal/scripts/q27_heartbeat_receipt.py btc_eth_terminal/scripts/q22_ci_5h_supervisor.py btc_eth_terminal/tests/test_q28_termination_incident.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q28_termination_incident.py' -v
      - name: Existing fault recovery and evidence gates
        run: |
          set -euo pipefail
          for pattern in test_q22_ci_5h_contract.py test_q23_diagnostics_and_replay.py test_q24_ws_close_forensics.py test_q25_session_gap_isolation.py test_q26_three_fault_recovery.py test_q27_heartbeat_guard.py test_q29_artifact_transport.py test_q29_evidence_gate.py test_v36_2_transport_gap.py test_v36_2_sse_backpressure.py test_v36_2_storage_faults.py test_v36_3_durable_archive_gate.py; do
            python -m unittest discover -s btc_eth_terminal/tests -p "$pattern" -v
          done
          node --test btc_eth_terminal/tests/q24_ws_close_probe.test.mjs
  journal-failover-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned linter
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Independent durable incident journal and epoch audit
        run: |
          set -euo pipefail
          ruff check btc_eth_terminal/scripts/q292_incident_journal.py btc_eth_terminal/tests/test_q292_incident_journal.py btc_eth_terminal/scripts/q22_ci_5h_supervisor.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q292_incident_journal.py' -v
      - name: Conservative dual source selection policy (synthetic)
        run: |
          ruff check btc_eth_terminal/scripts/q292_failover_policy.py btc_eth_terminal/tests/test_q292_failover_policy.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q292_failover_policy.py' -v
  dual-collector-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dual collector process and routing contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.22
          ruff check btc_eth_terminal/scripts/q292_dual_gateway.py btc_eth_terminal/tests/test_q292_dual_gateway.py
          node --check btc_eth_terminal/tests/q292_dual_source_mock.mjs
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q292_dual_gateway.py' -v
  independent-observer-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observer process isolation, timeout and orphan cleanup
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.22
          ruff check btc_eth_terminal/scripts/q292_dual_gateway.py btc_eth_terminal/scripts/q292_parent_bound_exec.py btc_eth_terminal/scripts/q292_isolated_observer.py btc_eth_terminal/tests/test_q292_isolated_observer.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q292_isolated_observer.py' -v
  durable-stream-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: btc_eth_terminal/backend:btc_eth_terminal/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Durable transitions and bounded SSE
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.22
          ruff check btc_eth_terminal/scripts/q292_stream_gateway.py btc_eth_terminal/tests/test_q292_stream_gateway.py
          python -m unittest discover -s btc_eth_terminal/tests -p 'test_q292_stream_gateway.py' -v
