name: Q7 source-only frontend rebuild (not release acceptance)
on:
  push:
    branches: [staging/q7-readonly-qualification-20261119]
    paths: [.github/workflows/q7_frontend_source_build_verified.yml, 'btc_eth_terminal/frontend/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q7-reviewed-funnest-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every current frontend source blob against the frozen Q7 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object btc_eth_terminal/frontend/src/ArchiveReplayPanel.tsx)" = "ca35448d06b96bb2921920e28a2bf50289e24087"
          test "$(git hash-object btc_eth_terminal/frontend/src/FactorLabPanel.tsx)" = "4e2c9347dd90f2e9748eec52602ee250d228a261"
          test "$(git hash-object btc_eth_terminal/frontend/src/LiveTerminal.tsx)" = "4980ef3aff17a3d89bc61ea7e58d34058966914f"
          test "$(git hash-object btc_eth_terminal/frontend/src/datafeed.ts)" = "706c361664f4923a4f2117aa5f0135a071178a24"
          test "$(git hash-object btc_eth_terminal/frontend/src/main.tsx)" = "b060ebd0e1340eaceec2ea667c6fbadeed1e0b19"
          test "$(git hash-object btc_eth_terminal/frontend/src/marketStateIntegrity.ts)" = "a18266085867a8f4d1381914c034cd4bc0174eca"
          test "$(git hash-object btc_eth_terminal/frontend/src/unified.tsx)" = "8465ff6f97d0ddae4a63c1f88db2f0bc17481b63"
          test "$(git hash-object btc_eth_terminal/frontend/src/v36_1_completed_candle_feed.ts)" = "bfc0e6d4d493597e2599895a49f260678d6ff9c2"
          test "$(git hash-object btc_eth_terminal/frontend/src/v36_client_liveness.ts)" = "0c9ddc5928ac61033fee91f5de0fdf35af664cf5"
          test "$(git hash-object btc_eth_terminal/frontend/src/style.css)" = "283a48be4a188fad484bac9d3ca9cebc61c289f5"
          test "$(git hash-object btc_eth_terminal/frontend/v37_dist_integrity.json)" = "e4b28a72ef15f772271236f7e047af4757fcc303"
          test "$(git hash-object btc_eth_terminal/frontend/package-lock.json)" = "f7e3d5cdc727a3c7f91f7b254cab90dafd7817b5"
      - name: Install reproducible dependencies from pinned lockfile
        working-directory: btc_eth_terminal/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and rebuild isolated v37 candidate without overwriting historical bundles
        working-directory: btc_eth_terminal/frontend
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build --outDir .dist_v37_candidate
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('.dist_v37_candidate')
          obj=json.loads(Path('v37_dist_integrity.json').read_bytes())
          if obj.get('trading_enabled') is not False:
              raise SystemExit('ORDERS_NOT_DISABLED')
          expected=set(obj['files'])
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          if actual!=expected: raise SystemExit('VERSIONED_ASSET_PATH_MISMATCH')
          for n, meta in obj['files'].items():
              raw=(root/n).read_bytes()
              if len(raw)!=meta['bytes'] or hashlib.sha256(raw).hexdigest()!=meta['sha256']:
                  raise SystemExit('VERSIONED_ASSET_DIGEST_MISMATCH:'+n)
          print('PASS_SOURCE_ONLY_Q7_BUILD_THREE_PINNED_ASSETS')
          print('NOT_RELEASE_ACCEPTANCE_PRIVATE_ARCHIVES_AND_LIVE_BROWSER_NOT_TESTED')
          PY
      - name: Execute fixture-free completed-candle contract tests
        working-directory: btc_eth_terminal/frontend
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/v36_1_completed_candle_feed.test.mjs | tee /tmp/q7_candles.log
          grep -q '# fail 0' /tmp/q7_candles.log
          grep -q '# skipped 0' /tmp/q7_candles.log
