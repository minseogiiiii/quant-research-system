[project]
name = "world-quant-system"
version = "0.1.0"
description = "Broker-neutral foundation for a safe quantitative trading system."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
]

[project.scripts]
world-quant-system = "world_quant_system.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_quant_system"]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.15.22,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.uv]
package = true
reinstall-package = ["world-quant-system"]
